<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sky Sports PL</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #1a1a1a;
            color: #fff;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .header {
            background-color: #0a0a0a;
            padding: 20px;
            border-bottom: 2px solid #333;
        }

        .header h1 {
            font-size: 24px;
            font-weight: 600;
        }

        .player-wrapper {
            flex: 1;
            overflow: hidden;
            background-color: #000;
        }

        .player-wrapper iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }

        .footer {
            background-color: #0a0a0a;
            padding: 15px 20px;
            border-top: 2px solid #333;
            font-size: 14px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Sky Sports Premier League</h1>
        </div>
        <div class="player-wrapper">
            <iframe src="https://daddyhd.com/cast/stream-130.php" width="100%" height="100%" style="border:0;" allowfullscreen></iframe>
        </div>
    </div>
</body>
</html>
